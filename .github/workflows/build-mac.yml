name: Build NOVLPD01-MAC

on:
  workflow_dispatch:

jobs:
  build:
    name: Build macOS App
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          sw_vers

      - name: List project schemes
        run: |
          xcodebuild \
            -project NOVLPD01-MAC.xcodeproj \
            -list

      - name: Build Release version
        run: |
          xcodebuild \
            -project NOVLPD01-MAC.xcodeproj \
            -scheme NOVLPD01-MAC \
            -configuration Release \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Verify application
        run: |
          echo "Looking for built application..."
          find "$PWD/build" -name "NOVLPD01-MAC.app" -print

          APP_PATH="$PWD/build/Build/Products/Release/NOVLPD01-MAC.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "NOVLPD01-MAC.app was not found."
            exit 1
          fi

          echo "Application found:"
          ls -la "$APP_PATH"

      - name: Create ZIP
        run: |
          APP_PATH="$PWD/build/Build/Products/Release/NOVLPD01-MAC.app"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            "$PWD/NOVLPD01-MAC.zip"

          ls -lh "$PWD/NOVLPD01-MAC.zip"

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NOVLPD01-MAC
          path: NOVLPD01-MAC.zip
          if-no-files-found: error
